name: Promotion

# The promotion check on every pull request into main. Versioning checks its own promotion with the actions the
# candidate holds, where a project calls them at the Versioning release it follows.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Each action is pinned to the commit of the release named in its comment.
jobs:
  promotion:
    name: Promotion
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./actions/promotion-check
        with:
          gate-workflow: ci.yml
          version-command: (Get-Content VERSION -Raw).Trim()
